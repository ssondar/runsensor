<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RunSensor 기록기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column — session bar on top, one card per sensor below */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #17201c;
  --muted: #5d6b64;
  --line: #d9e0dc;
  --accent: #0f7a5a;
  --accent-ink: #ffffff;
  --rec: #c8322b;
  --warn: #b7791f;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #18201c; --ink: #e6ece9; --muted: #98a6a0; --line: #2a3530;
    --accent: #3cc28f; --accent-ink: #08130e; --rec: #ff6b5e; --warn: #e3b053; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #18201c; --ink: #e6ece9; --muted: #98a6a0; --line: #2a3530;
  --accent: #3cc28f; --accent-ink: #08130e; --rec: #ff6b5e; --warn: #e3b053; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body);
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 20px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
.session { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); padding: 10px 14px; cursor: pointer; min-height: 44px;
}
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); flex: 1; }
.stop { background: var(--rec); color: #fff; border-color: var(--rec); flex: 1; }
.label { font-size: 12px; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.cards { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.name { font-weight: 600; font-size: 16px; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.rec { color: #fff; background: var(--rec); border-color: var(--rec); }
.pill.idle { color: var(--accent); border-color: var(--accent); }
.pill.dl { color: var(--warn); border-color: var(--warn); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat .v { font-family: var(--font-data); font-size: 15px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.low { color: var(--rec); }
progress { width: 100%; height: 8px; accent-color: var(--accent); }
.empty { color: var(--muted); text-align: center; padding: 24px 12px; border: 1px dashed var(--line); border-radius: 12px; }
.msg { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.msg.err { color: var(--rec); }
footer { color: var(--muted); font-size: 12px; text-align: center; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
/* Live view: three readouts, then two scrolling 10 s graphs (acceleration, rotation) */
:root { --x: #2a78d6; --y: #eb6834; --z: #1baf7a; --grid: #e6ebe8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --x: #3987e5; --y: #d95926; --z: #199e70; --grid: #26302b; } }
:root[data-theme="dark"] { --x: #3987e5; --y: #d95926; --z: #199e70; --grid: #26302b; }
.live { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.live .stats .v { font-size: 20px; }
.live .label { text-transform: none; }
.live-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.live canvas { width: 100%; height: 120px; display: block; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.live-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <header>
    <h1>RunSensor 기록기</h1>
    <p class="sub">센서를 연결하고 한 번에 기록을 시작하세요. 안드로이드 크롬에서 동작해요.</p>
  </header>

  <section class="session" aria-label="세션">
    <div class="row">
      <button id="btnStart" class="primary" disabled>모두 기록 시작</button>
      <button id="btnStop" class="stop" disabled>모두 정지</button>
    </div>
    <div class="row">
      <button id="btnAdd" style="flex:1">+ 센서 연결</button>
    </div>
    <div class="row">
      <button id="btnGps" style="flex:1">GPS 켜기</button>
    </div>
    <div id="gpsBox" class="stats" hidden>
      <div class="stat"><span class="label">속도</span><span class="v" id="gpsSpeed">–</span></div>
      <div class="stat"><span class="label">페이스</span><span class="v" id="gpsPace">–</span></div>
      <div class="stat"><span class="label">거리</span><span class="v" id="gpsDist">–</span></div>
    </div>
    <div id="gpsInfo" class="msg" hidden></div>
    <div id="sessionInfo" class="msg">연결된 센서가 없어요.</div>
  </section>

  <section id="cards" class="cards" aria-label="센서 목록">
    <div id="empty" class="empty">"+ 센서 연결"을 눌러 RunSensor를 고르세요.<br>센서 4개까지 차례로 연결할 수 있어요.</div>
  </section>
  <footer id="version"></footer>
</main>

<script>
const SERVICE = "19b10010-e8f2-537e-4f6c-d104768a1214";
const CMD     = "19b10011-e8f2-537e-4f6c-d104768a1214";
const STATUS  = "19b10012-e8f2-537e-4f6c-d104768a1214";
const DATA    = "19b10013-e8f2-537e-4f6c-d104768a1214";
const LIVE    = "19b10014-e8f2-537e-4f6c-d104768a1214";
const END_IDX = 0xFFFFFFFF;
const MARKER  = 0xFFFFFFFE;   // first sample of a recording: holds its start time
const APP_VERSION = "웹 앱 v1.0 · 2026-10-25";

const sensors = new Map();   // device.id -> sensor object
let sessionName = null;

const $ = id => document.getElementById(id);

function stamp(d = new Date()) {
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

function parseStatus(text) {
  // "IDLE 1388/131072 3.95V", "REC 2500/131072 3.90V", "DL 500/1388 3.90V", "ERASING"
  const fw = (text.match(/\b(v\d+\.\d+)\b/) || [])[1] || null;
  const m = text.match(/^(\w+)\s+(\d+)\/(\d+)(?:\s+([\d.]+)V)?/);
  if (!m) return { state: text.trim().split(" ")[0], a: null, b: null, volts: null, fw };
  return { state: m[1], a: +m[2], b: +m[3], volts: m[4] ? +m[4] : null, fw };
}

function stateLabel(st) {
  return { REC: "기록 중", IDLE: "대기", FULL: "가득 참", DL: "내려받는 중", ERASING: "지우는 중" }[st] || st || "연결 중";
}

function render() {
  const list = [...sensors.values()];
  $("empty").hidden = list.length > 0;
  const connected = list.filter(s => s.connected);
  $("btnStart").disabled = connected.length === 0;
  $("btnStop").disabled = connected.length === 0;
  $("sessionInfo").textContent = list.length === 0 ? "연결된 센서가 없어요."
    : `연결 ${connected.length}/${list.length}개` + (sessionName ? ` · 세션 ${sessionName}` : "");
  for (const s of list) renderCard(s);
}

function renderCard(s) {
  if (!s.el) {
    s.el = document.createElement("article");
    s.el.className = "card";
    s.el.innerHTML = `
      <div class="card-head"><span class="name"></span><span class="pill"></span></div>
      <div class="stats">
        <div class="stat"><span class="label">저장</span><span class="v" data-k="count">–</span></div>
        <div class="stat"><span class="label">기록 시간</span><span class="v" data-k="time">–</span></div>
        <div class="stat"><span class="label">배터리</span><span class="v" data-k="bat">–</span></div>
      </div>
      <progress max="1" value="0" hidden></progress>
      <div class="row">
        <button data-a="dl">내려받기</button>
        <button data-a="erase">지우기</button>
        <button data-a="conn">연결 끊기</button>
        <button data-a="live">실시간 보기</button>
      </div>
      <div class="live" hidden>
        <div class="live-head"><span class="label">실시간 · 50Hz</span><button data-a="zero">기준 맞추기</button></div>
        <div class="stats live-stats">
          <div class="stat"><span class="label">케이던스</span><span class="v" data-k="cad">–</span></div>
          <div class="stat"><span class="label">기울기</span><span class="v" data-k="tilt">–</span></div>
          <div class="stat"><span class="label">가속도</span><span class="v" data-k="acc">–</span></div>
          <div class="stat"><span class="label">회전</span><span class="v" data-k="rot">–</span></div>
        </div>
        <div class="legend"><span><i style="background:var(--x)"></i>x</span><span><i style="background:var(--y)"></i>y</span><span><i style="background:var(--z)"></i>z</span><span data-k="rate"></span></div>
        <span class="label">가속도 (g) · 최근 10초</span>
        <canvas data-c="acc"></canvas>
        <span class="label">회전 (°/s) · 최근 10초</span>
        <canvas data-c="gyro"></canvas>
      </div>
      <div class="confirm" hidden>센서의 기록을 모두 지울까요? 되돌릴 수 없어요.
        <button data-a="erase-yes">지우기</button><button data-a="erase-no">취소</button></div>
      <div class="msg"></div>`;
    s.el.addEventListener("click", e => {
      const a = e.target.closest("button")?.dataset.a;
      if (a) onCardAction(s, a);
    });
    $("cards").appendChild(s.el);
  }
  const q = sel => s.el.querySelector(sel);
  q(".name").textContent = (s.device.name || "RunSensor") + (s.status.fw ? ` · 펌웨어 ${s.status.fw}` : "");
  const st = s.connected ? s.status.state : "OFF";
  const pill = q(".pill");
  pill.textContent = s.connected ? stateLabel(st) : "연결 끊김";
  pill.className = "pill" + (st === "REC" ? " rec" : st === "IDLE" ? " idle" : st === "DL" ? " dl" : "");
  const count = st === "DL" ? s.status.b : s.status.a;
  q('[data-k="count"]').textContent = count == null ? "–" : count.toLocaleString("ko-KR");
  q('[data-k="time"]').textContent = count == null ? "–" : fmtDuration(count / 100);
  const bat = q('[data-k="bat"]');
  bat.textContent = s.status.volts == null ? "–" : s.status.volts.toFixed(2) + " V";
  bat.classList.toggle("low", s.status.volts != null && s.status.volts < 3.5);
  const prog = q("progress");
  prog.hidden = !s.download;
  if (s.download) { prog.max = Math.max(1, s.download.expected); prog.value = s.download.received; }
  q('[data-a="dl"]').disabled = !s.connected || !s.hasData || st === "REC" || !!s.download;
  q('[data-a="erase"]').disabled = !s.connected || st === "REC" || !!s.download;
  q('[data-a="conn"]').textContent = s.connected ? "연결 끊기" : "다시 연결";
  q('[data-a="live"]').textContent = s.live ? "실시간 끄기" : "실시간 보기";
  q('[data-a="live"]').disabled = !s.connected || !s.hasLive || !!s.download;
  q(".live").hidden = !s.live;
  const msg = q(".msg");
  msg.textContent = s.msg || "";
  msg.classList.toggle("err", !!s.err);
}

function fmtDuration(sec) {
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m > 0 ? `${m}분 ${s}초` : `${s}초`;
}

function setMsg(s, text, err = false) { s.msg = text; s.err = err; render(); }

async function sendCmd(s, c) {
  if (!s.connected) return;
  try {
    await s.cmd.writeValue(new TextEncoder().encode(c));
  } catch (e) {
    setMsg(s, "명령을 보내지 못했어요. 다시 눌러 보세요.", true);
  }
}

async function connectSensor(s) {
  let step = "연결";
  try {
    setMsg(s, "연결 중...");
    const server = await s.device.gatt.connect();
    step = "서비스 찾기";
    const svc = await server.getPrimaryService(SERVICE);
    step = "명령 특성";
    s.cmd = await svc.getCharacteristic(CMD);
    step = "상태 특성";
    s.statusChar = await svc.getCharacteristic(STATUS);
    // after a reconnect the browser hands out new characteristic objects, so hook them up every time
    s.onStatus = s.onStatus || (e => { s.status = parseStatus(new TextDecoder().decode(e.target.value)); render(); });
    s.statusChar.removeEventListener("characteristicvaluechanged", s.onStatus);
    s.statusChar.addEventListener("characteristicvaluechanged", s.onStatus);
    step = "상태 알림 켜기";
    await s.statusChar.startNotifications();
    s.status = parseStatus(new TextDecoder().decode(await s.statusChar.readValue()));
    step = "데이터 특성";
    try {
      s.data = await svc.getCharacteristic(DATA);
      s.onData = s.onData || (e => onData(s, e.target.value));
      s.data.removeEventListener("characteristicvaluechanged", s.onData);
      s.data.addEventListener("characteristicvaluechanged", s.onData);
      await s.data.startNotifications();
      s.hasData = true;
    } catch (e) {
      s.hasData = false;   // old firmware without Bluetooth download
    }
    try {
      s.liveChar = await svc.getCharacteristic(LIVE);
      s.onLive = s.onLive || (e => onLive(s, e.target.value));
      s.liveChar.removeEventListener("characteristicvaluechanged", s.onLive);
      s.liveChar.addEventListener("characteristicvaluechanged", s.onLive);
      await s.liveChar.startNotifications();
      s.hasLive = true;
    } catch (e) {
      s.hasLive = false;   // firmware older than v0.7
    }
    s.live = false;
    s.connected = true;
    setMsg(s, s.hasData ? "" : "센서 펌웨어가 예전 버전이라 내려받기를 쓸 수 없어요. 새 run_logger.ino를 올려 주세요.", !s.hasData);
  } catch (e) {
    s.connected = false;
    try { s.device.gatt.disconnect(); } catch (_) {}
    setMsg(s, `연결 실패 (${step}): ${e.message || e}`, true);
    throw e;
  }
}

async function addSensor() {
  if (!navigator.bluetooth) {
    $("sessionInfo").textContent = "이 브라우저는 블루투스를 지원하지 않아요. 안드로이드 크롬으로 열어 주세요.";
    $("sessionInfo").className = "msg err";
    return;
  }
  let device;
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "RunSensor" }], optionalServices: [SERVICE]
    });
  } catch (e) { return; }   // user closed the picker
  if (sensors.has(device.id) && sensors.get(device.id).connected) return;
  const s = sensors.get(device.id) || { device, status: {}, connected: false };
  sensors.set(device.id, s);
  if (!s.listening) {
    s.listening = true;
    device.addEventListener("gattserverdisconnected", () => {
      const was = s.connected;
      s.connected = false;
      s.live = false;
      if (s.download) { clearTimeout(s.download.timer); s.download = null; setMsg(s, "내려받는 중에 연결이 끊겼어요. 다시 연결해서 처음부터 받아 주세요.", true); }
      else if (was) setMsg(s, "연결이 끊겼어요. 센서가 켜져 있는지 확인하고 \"다시 연결\"을 누르세요.", true);
      else render();
    });
  }
  try { await connectSensor(s); } catch (e) { /* message already shown on the card */ }
}

async function onCardAction(s, a) {
  const q = sel => s.el.querySelector(sel);
  if (a === "conn") {
    if (s.connected) { s.device.gatt.disconnect(); }
    else { try { await connectSensor(s); } catch (e) { /* message already shown on the card */ } }
  } else if (a === "erase") {
    q(".confirm").hidden = false;
  } else if (a === "erase-no") {
    q(".confirm").hidden = true;
  } else if (a === "erase-yes") {
    q(".confirm").hidden = true;
    setMsg(s, "지우는 중이에요. 약 30초 걸려요.");
    await sendCmd(s, "e");
  } else if (a === "dl") {
    startDownload(s);
  } else if (a === "live") {
    if (s.live) { s.live = false; await sendCmd(s, "l"); render(); }
    else { startLive(s); await sendCmd(s, "L"); }
  } else if (a === "zero") {
    if (s.lv && s.lv.grav) { s.lv.ref = s.lv.grav.slice(); setMsg(s, "지금 자세를 기준(0°)으로 정했어요."); }
  }
}

// ---------- download ----------
// First pass: the app asks for the whole recording in chunks ('G' + index + count) without stopping for lost packets.
// Then it asks again only for the samples that did not arrive.
// Firmware v0.4 ignores the count and always sends 32; that still works, just more slowly.

const CHUNK = 1024;
const MERGE_GAP = 16;           // in the repair passes, ask for nearby gaps together
const FIRST_PACKET_MS = 1500;   // wait this long for the first packet after a request
const IDLE_MS = 300;            // then this long after the last packet before moving on
const MAX_RETRIES = 15;

async function startDownload(s) {
  const expected = s.status.a || 0;
  if (expected === 0) { setMsg(s, "저장된 기록이 없어요."); return; }
  s.download = { expected, received: 0, rows: new Array(expected), cursor: 0, next: 0, chunkEnd: 0,
                 lastIdx: -1, retries: 0, timer: null, t0: Date.now() };
  setMsg(s, "내려받는 중... 화면을 켜 두세요.");
  requestChunk(s);
}

function armTimer(s, ms) {
  const d = s.download;
  clearTimeout(d.timer);
  d.timer = setTimeout(() => onTimeout(s), ms);
}

async function requestChunk(s) {
  const d = s.download;
  if (!d) return;
  let start, end;
  if (d.cursor < d.expected) {                       // first pass
    start = d.cursor;
    end = Math.min(start + CHUNK, d.expected);
    d.cursor = end;
  } else {                                           // repair passes
    while (d.next < d.expected && d.rows[d.next]) d.next++;
    if (d.next >= d.expected) { finishDownload(s); return; }
    start = end = d.next;
    for (let i = start; i < d.expected && i < start + CHUNK; i++) {
      if (!d.rows[i]) end = i + 1;
      else if (i - end >= MERGE_GAP) break;
    }
  }
  d.reqStart = start;
  d.chunkEnd = end;
  armTimer(s, FIRST_PACKET_MS);
  const buf = new Uint8Array(7);
  const dv = new DataView(buf.buffer);
  buf[0] = 71;   // 'G'
  dv.setUint32(1, start, true);
  dv.setUint16(5, end - start, true);
  try {
    await s.cmd.writeValue(buf);
  } catch (e) {
    // the timer will try again
  }
}

function onTimeout(s) {
  const d = s.download;
  if (!d) return;
  if (d.cursor >= d.expected && ++d.retries > MAX_RETRIES) { finishDownload(s); return; }
  // the stream stopped early (lost packets or old firmware): carry on right after the last sample that arrived
  if (d.cursor === d.chunkEnd && d.lastIdx + 1 < d.chunkEnd && d.lastIdx + 1 > d.chunkEnd - CHUNK) d.cursor = d.lastIdx + 1;
  requestChunk(s);
}

function showProgress(s) {
  const d = s.download;
  const sec = (Date.now() - d.t0) / 1000;
  const rate = d.received / Math.max(sec, 1);
  const left = rate > 0 ? (d.expected - d.received) / rate : 0;
  const pct = Math.floor(d.received / d.expected * 100);
  setMsg(s, `내려받는 중 ${pct}% · 초당 ${Math.round(rate)}개 · 패킷 ${d.maxPkt}바이트 · 남은 시간 약 ${fmtDuration(left)}. 화면을 켜 두세요.`);
}

function onData(s, dv) {
  // packet = index of the first sample (uint32) + one or more 16-byte samples (firmware v0.6 packs up to 15)
  const d = s.download;
  if (!d || dv.byteLength < 20) return;
  const first = dv.getUint32(0, true);
  if (first === END_IDX) {   // asked past the end of the recording
    d.expected = Math.min(d.expected, d.reqStart);
    d.cursor = Math.min(d.cursor, d.expected);
    requestChunk(s);
    return;
  }
  const n = Math.floor((dv.byteLength - 4) / 16);
  d.maxPkt = Math.max(d.maxPkt || 0, dv.byteLength);
  for (let j = 0; j < n; j++) {
    const idx = first + j;
    if (idx >= d.expected) break;
    d.lastIdx = idx;
    if (d.rows[idx]) continue;
    const o = 4 + 16 * j;
    const t = dv.getUint32(o, true);
    let v;
    if (t === MARKER) v = { start: dv.getUint32(o + 4, true) };   // a new recording begins here
    else {
      v = [t];
      for (let k = 0; k < 6; k++) v.push(dv.getInt16(o + 4 + 2 * k, true));
    }
    d.rows[idx] = v;
    d.received++;
    d.retries = 0;
    if (d.received % 500 === 0) showProgress(s);
  }
  if (d.lastIdx >= d.chunkEnd - 1) requestChunk(s);   // chunk done: ask for the next one right away
  else armTimer(s, IDLE_MS);                          // a packet may be lost; move on soon if the stream stops
}

// Each recording becomes its own file: <start time>_<sensor>.csv, e.g. 20261025_150349_L.csv
// Firmware v0.8+ stores the start time; older recordings are named by the download time + a number.
function finishDownload(s) {
  const d = s.download;
  clearTimeout(d.timer);
  s.download = null;
  const recs = [];
  let cur = null, lastT = -1, missing = 0, count = 0;
  for (let i = 0; i < d.expected; i++) {
    const r = d.rows[i];
    if (!r) { missing++; continue; }
    if (!Array.isArray(r)) { cur = { start: r.start, rows: [] }; recs.push(cur); lastT = -1; continue; }
    if (!cur || r[0] < lastT) { cur = { start: 0, rows: [] }; recs.push(cur); }   // old firmware: t restarts at 0
    lastT = r[0];
    cur.rows.push(r);
    count++;
  }
  const full = recs.filter(r => r.rows.length > 0);
  if (count === 0) {
    setMsg(s, "센서에서 데이터가 오지 않았어요. \"연결 끊기\" → \"다시 연결\" 후 다시 내려받아 보세요.", true);
    return;
  }
  const dlStamp = stamp();
  const names = full.map((r, i) => {
    const when = r.start ? stamp(new Date(r.start * 1000)) : `${dlStamp}_rec${i + 1}`;
    const name = `${when}_${sensorTag(s)}.csv`;
    const lines = ["t_ms,ax_mg,ay_mg,az_mg,gx_01dps,gy_01dps,gz_01dps", ...r.rows.map(x => x.join(","))];
    setTimeout(() => saveFile(name, lines.join("\n") + "\n", "text/csv"), i * 600);
    return name;
  });
  const miss = missing ? ` · 빠진 샘플 ${missing}개` : " · 빠진 샘플 없음";
  const secs = Math.round((Date.now() - d.t0) / 1000);
  const pkt = d.maxPkt ? ` · 패킷 ${d.maxPkt}바이트` : "";
  const what = names.length === 1 ? names[0] : `파일 ${names.length}개 (${names.join(", ")})`;
  setMsg(s, `${what} 저장 완료 · ${count.toLocaleString("ko-KR")}개${miss} · ${secs}초 걸림${pkt}`, missing > 0);
}

// "RunSensor-L" -> "L"
function sensorTag(s) {
  return (s.device.name || "RunSensor").replace(/^RunSensor-?/, "") || "S";
}

function saveFile(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

// ---------- live view ----------
// Packet = time ms of the first sample (uint32) + up to 5 samples (ax ay az mg, gx gy gz 0.1 dps), 20 ms apart.

const LIVE_N = 500;   // 10 s at 50Hz

function startLive(s) {
  s.live = true;
  s.lv = { buf: [], grav: null, ref: null, count: 0, t0: Date.now(), rate: 0, steps: makeStepDetector() };
  keepScreenOn();
  render();
  requestAnimationFrame(drawLoop);
}

function onLive(s, dv) {
  const L = s.lv;
  if (!s.live || !L || dv.byteLength < 16) return;
  const n = Math.floor((dv.byteLength - 4) / 12);
  for (let j = 0; j < n; j++) {
    const o = 4 + 12 * j;
    const a = [0, 1, 2].map(k => dv.getInt16(o + 2 * k, true) / 1000);
    const g = [3, 4, 5].map(k => dv.getInt16(o + 2 * k, true) / 10);
    L.buf.push([...a, ...g]);
    if (L.buf.length > LIVE_N) L.buf.shift();
    // gravity direction = slowly smoothed acceleration (about 0.4 s)
    L.grav = L.grav ? L.grav.map((v, k) => v * 0.95 + a[k] * 0.05) : a.slice();
    stepUpdate(L.steps, Math.hypot(a[0], a[1], a[2]));
    L.count++;
  }
  const sec = (Date.now() - L.t0) / 1000;
  if (sec > 2) { L.rate = L.count / sec; L.t0 = Date.now(); L.count = 0; }
}

function angleDeg(u, v) {
  const dot = u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
  const nu = Math.hypot(...u), nv = Math.hypot(...v);
  if (!nu || !nv) return 0;
  return Math.acos(Math.max(-1, Math.min(1, dot / (nu * nv)))) * 180 / Math.PI;
}

function drawLoop() {
  let any = false;
  for (const s of sensors.values()) {
    if (!s.live || !s.lv || !s.el) continue;
    any = true;
    const L = s.lv, q = sel => s.el.querySelector(sel);
    const last = L.buf[L.buf.length - 1];
    if (last) {
      // until "기준 맞추기" is pressed, tilt is measured from straight down (gravity on z only)
      const ref = L.ref || [0, 0, 1];
      q('[data-k="tilt"]').textContent = Math.round(angleDeg(L.grav, ref)) + "°";
      const recent = L.buf.slice(-25);   // last 0.5 s
      q('[data-k="acc"]').textContent = Math.max(...recent.map(r => Math.hypot(r[0], r[1], r[2]))).toFixed(1) + " g";
      q('[data-k="rot"]').textContent = Math.round(Math.max(...recent.map(r => Math.hypot(r[3], r[4], r[5])))) + "°/s";
      // a foot sensor (L or R) sees every second step
      const cad = cadence(L.steps, /^[LR]$/.test(sensorTag(s)) ? 2 : 1);
      q('[data-k="cad"]').textContent = cad ? Math.round(cad) + " 걸음/분" : "–";
      q('[data-k="rate"]').textContent = L.rate ? `수신 ${Math.round(L.rate)}Hz` : "";
    }
    drawGraph(q('[data-c="acc"]'), L.buf, 0, 2);
    drawGraph(q('[data-c="gyro"]'), L.buf, 3, 250);
  }
  if (any) requestAnimationFrame(drawLoop);
}

// Draws three lines (x y z) from column `col`; the scale grows if values exceed `minRange`.
function drawGraph(cv, buf, col, minRange) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  let range = minRange;
  for (const r of buf) for (let k = 0; k < 3; k++) range = Math.max(range, Math.abs(r[col + k]));
  const y = v => h / 2 - (v / range) * (h / 2 - 4);
  c.strokeStyle = css.getPropertyValue("--grid"); c.lineWidth = 1;
  c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
  c.fillStyle = css.getPropertyValue("--muted"); c.font = "11px " + css.getPropertyValue("--font-data");
  c.fillText("+" + (range >= 100 ? Math.round(range) : range.toFixed(1)), 2, 11);
  c.fillText("−" + (range >= 100 ? Math.round(range) : range.toFixed(1)), 2, h - 3);
  ["--x", "--y", "--z"].forEach((v, k) => {
    c.strokeStyle = css.getPropertyValue(v); c.lineWidth = 2; c.lineJoin = "round";
    c.beginPath();
    buf.forEach((r, i) => {
      const px = w - (buf.length - 1 - i) * (w / (LIVE_N - 1));
      i ? c.lineTo(px, y(r[col + k])) : c.moveTo(px, y(r[col + k]));
    });
    c.stroke();
  });
}

// ---------- session ----------

$("btnAdd").addEventListener("click", addSensor);
let sessionStartMs = 0, sessionRecording = false;

function fwNum(s) { return parseFloat((s.status.fw || "v0").slice(1)) || 0; }

$("btnStart").addEventListener("click", async () => {
  sessionStartMs = Date.now();
  sessionName = stamp(new Date(sessionStartMs));
  sessionRecording = true;
  gps.points = []; gps.dist = 0; gps.prev = null;
  const buf = new Uint8Array(5);
  buf[0] = 82;   // 'R' + start time, so the file can be named after it (firmware v0.8+)
  new DataView(buf.buffer).setUint32(1, Math.floor(sessionStartMs / 1000), true);
  for (const s of sensors.values()) {
    if (!s.connected) continue;
    if (fwNum(s) >= 0.8) {
      try { await s.cmd.writeValue(buf); } catch (e) { setMsg(s, "명령을 보내지 못했어요. 다시 눌러 보세요.", true); }
    } else await sendCmd(s, "r");
  }
  keepScreenOn();
  render();
});
$("btnStop").addEventListener("click", async () => {
  for (const s of sensors.values()) await sendCmd(s, "s");
  if (sessionRecording && gps.points.length) saveGpsFile();
  sessionRecording = false;
  render();
});

// ---------- cadence ----------
// Steps = peaks in total acceleration, at least 0.27 s apart; cadence = median of the last 10 step intervals.

function makeStepDetector() {
  return { mags: [], n: 0, lastStep: -1e9, intervals: [] };
}
function stepUpdate(c, mag) {
  c.mags.push(mag); if (c.mags.length > 150) c.mags.shift();
  c.n++;
  const m = c.mags, k = m.length;
  if (k < 50) return;
  const mean = m.reduce((a, b) => a + b, 0) / k;
  const sd = Math.sqrt(m.reduce((a, b) => a + (b - mean) ** 2, 0) / k);
  const thr = Math.max(1.08, mean + 0.8 * sd, mean + 0.12);
  const p = m[k - 2];
  const t = (c.n - 2) * 0.02;
  if (p > m[k - 3] && p >= m[k - 1] && p > thr && t - c.lastStep > 0.27) {
    if (t - c.lastStep < 2) { c.intervals.push(t - c.lastStep); if (c.intervals.length > 10) c.intervals.shift(); }
    else c.intervals = [];
    c.lastStep = t;
  }
}
function cadence(c, mult) {
  const t = (c.n - 1) * 0.02;
  if (t - c.lastStep > 2 || c.intervals.length < 4) return null;
  const s = [...c.intervals].sort((a, b) => a - b);
  const med = s[Math.floor(s.length / 2)];
  const steady = s.filter(x => Math.abs(x - med) < 0.25 * med).length;
  if (steady < 0.6 * s.length || 60 / med < 70) return null;   // not a steady walk or run
  return 60 / med * mult;
}
// ---------- GPS ----------
// The phone's location gives speed, pace and distance. While recording, points are saved as <session>_GPS.csv.

const gps = { watch: null, points: [], dist: 0, prev: null, speeds: [] };

function haversine(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function onPosition(pos) {
  const c = pos.coords, p = { t: pos.timestamp, lat: c.latitude, lon: c.longitude, acc: c.accuracy };
  let speed = c.speed;
  if (gps.prev && c.accuracy < 30) {
    const d = haversine(gps.prev, p), dt = (p.t - gps.prev.t) / 1000;
    if (speed == null && dt > 0) speed = d / dt;
    if (sessionRecording) gps.dist += d;
  }
  if (c.accuracy < 30 || !gps.prev) gps.prev = p;
  gps.speeds.push({ t: p.t, v: speed || 0 });
  while (gps.speeds.length && p.t - gps.speeds[0].t > 5000) gps.speeds.shift();   // average over 5 s
  const v = gps.speeds.reduce((a, b) => a + b.v, 0) / gps.speeds.length;
  if (sessionRecording) gps.points.push({ ...p, speed: speed == null ? "" : speed.toFixed(2) });
  $("gpsSpeed").textContent = (v * 3.6).toFixed(1) + " km/h";
  $("gpsPace").textContent = v > 0.5 ? fmtPace(1000 / v) : "–";
  $("gpsDist").textContent = (gps.dist / 1000).toFixed(2) + " km";
  $("gpsInfo").textContent = `GPS 정확도 ±${Math.round(c.accuracy)}m` + (c.accuracy > 30 ? " · 하늘이 보이는 곳으로 가면 더 정확해져요." : "");
}

function fmtPace(secPerKm) {
  const m = Math.floor(secPerKm / 60), s = Math.round(secPerKm % 60);
  return `${m}'${String(s).padStart(2, "0")}"/km`;
}

function saveGpsFile() {
  const lines = ["t_ms,unix_ms,lat,lon,accuracy_m,speed_mps",
    ...gps.points.map(p => [p.t - sessionStartMs, p.t, p.lat.toFixed(7), p.lon.toFixed(7), Math.round(p.acc), p.speed].join(","))];
  saveFile(`${sessionName}_GPS.csv`, lines.join("\n") + "\n", "text/csv");
}

$("btnGps").addEventListener("click", () => {
  if (gps.watch != null) {
    navigator.geolocation.clearWatch(gps.watch);
    gps.watch = null;
    $("btnGps").textContent = "GPS 켜기";
    $("gpsBox").hidden = $("gpsInfo").hidden = true;
    return;
  }
  $("gpsInfo").hidden = false;
  if (!navigator.geolocation) { $("gpsInfo").textContent = "이 브라우저는 위치를 쓸 수 없어요."; return; }
  $("gpsBox").hidden = false;
  $("gpsInfo").textContent = "위치를 찾는 중... 처음에는 몇십 초 걸릴 수 있어요.";
  $("btnGps").textContent = "GPS 끄기";
  gps.watch = navigator.geolocation.watchPosition(onPosition,
    e => { $("gpsInfo").textContent = "위치를 가져오지 못했어요: " + (e.code === 1 ? "위치 권한을 허용해 주세요." : e.message); },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  keepScreenOn();
});

// Keep the screen on while recording, live view or GPS is in use (Chrome pauses the page when it turns off).
let wakeLock = null;
async function keepScreenOn() {
  try {
    if (!wakeLock && navigator.wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && (sessionRecording || gps.watch != null || [...sensors.values()].some(s => s.live))) keepScreenOn();
});

$("version").textContent = APP_VERSION;
render();
</script>
</body>
</html>
